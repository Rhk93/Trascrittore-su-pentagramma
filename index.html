<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spartito dal Vivo</title>
<style>
:root{--bg:linear-gradient(160deg,#fff0f7,#eef5ff 55%,#effff5);--card:rgba(255,255,255,.82);--ink:#1c1c1e;--mut:#8e8e93;--accent:#ff4f8b;--accent2:#6c5cff;--line:rgba(0,0,0,.08)}
[data-theme=azzurro]{--bg:linear-gradient(160deg,#e3f4ff,#f0faff 55%,#e6f7ff);--accent:#1e9bf0;--accent2:#38c6f4}
[data-theme=mare]{--bg:linear-gradient(160deg,#e6f6ff,#f2fbff 60%,#e9fffb);--accent:#0a84ff;--accent2:#14b8a6}
[data-theme=tramonto]{--bg:linear-gradient(160deg,#fff3e3,#fff0f0 60%,#fff8e8);--accent:#ff7a00;--accent2:#ff2d55}
[data-theme=menta]{--bg:linear-gradient(160deg,#eafff4,#f4fff9 60%,#eef9ff);--accent:#00b383;--accent2:#5856d6}
[data-theme=limone]{--bg:linear-gradient(160deg,#fffbdc,#fffdf0 60%,#fff1f1);--accent:#f2a900;--accent2:#ff5e5e}
[data-theme=caramella]{--bg:linear-gradient(160deg,#f6ecff,#fff0fb 60%,#eaf7ff);--accent:#af52de;--accent2:#ff6fb5}
[data-theme=notte]{--bg:linear-gradient(160deg,#0c0c1d,#151530 60%,#0d1a24);--card:rgba(30,30,50,.82);--ink:#f2f2f7;--mut:#9a9ab0;--accent:#bf5af2;--accent2:#64d2ff;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);background-attachment:fixed;color:var(--ink);padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--card) 70%,transparent);border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;font-family:inherit;font-weight:700;font-size:21px;border:0;background:transparent;color:var(--ink);padding:6px 4px;border-radius:10px;outline:none}
#title:focus{background:var(--card)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--accent);font-size:19px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.06);margin-bottom:12px;backdrop-filter:blur(12px)}
.live{display:flex;align-items:center;gap:14px}
#bigNote{font-size:44px;font-weight:800;width:120px;flex:none;height:64px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.live{min-height:128px}.lv{flex:1;min-width:0}#status,#hz{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:20px;line-height:20px}
#hz{font-size:13px;color:var(--mut)}
.meter{height:8px;border-radius:5px;background:var(--line);position:relative;margin:7px 0;overflow:hidden}
#cent{position:absolute;top:0;bottom:0;width:6px;border-radius:3px;background:var(--accent);left:50%;transition:left .08s}
.meter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--mut);opacity:.5}
#lvl{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .06s}
#status{font-size:14px;font-weight:600}
.dots{margin-top:2px;height:56px;opacity:.45;transition:opacity .3s}.dots.go{opacity:1}.dots svg{display:block}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.red{background:#ff3b30;color:#fff}
.ic{width:18px;height:18px;vertical-align:-4px;margin-right:6px}#quick .spd .ic{margin:0;width:22px;height:22px;color:var(--mut)}
.btn.sm{padding:8px 14px;font-size:14px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:10px}
.stp{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 6px;box-shadow:0 2px 10px rgba(0,0,0,.07);font-size:14px;font-weight:600}
.stp button{width:30px;height:30px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:18px;cursor:pointer}
.meta{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
#score{color:var(--ink);overflow-x:auto}
#score svg{display:block;user-select:none}
.mh{cursor:pointer}
#editor{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.12);padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);transform:translateY(110%);transition:transform .25s}
#editor.open{transform:none}
.er{display:flex;gap:6px;overflow-x:auto;padding:4px 0;align-items:center}
.er::-webkit-scrollbar{display:none}
.ch{flex:none;border:0;border-radius:12px;padding:9px 11px;font-family:inherit;font-weight:600;font-size:14px;background:var(--line);color:var(--ink);cursor:pointer}
.ch.on{background:var(--accent);color:#fff}
.ch.nt{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2);min-width:44px}
#einfo{font-size:13px;font-weight:600;flex:1;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.3);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}
[data-theme=notte] .panel{background:#1d1d33}
.panel h2{margin:0 0 12px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.row small{color:var(--mut);display:block;font-size:12px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px}
#quick .spd{display:flex;align-items:center;gap:8px;width:100%;max-width:420px;justify-content:center}#quick .spd input{flex:1;width:auto;height:28px}#quick .spd b{min-width:66px;text-align:right;font-size:14px;color:var(--accent)}
#quick .seg{flex-wrap:wrap;justify-content:center}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kb{border:0;border-radius:14px;padding:10px 6px;background:var(--line);color:var(--ink);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.kb b{font-size:18px}.kb span{font-size:12px}.kb.on{background:var(--accent);color:#fff}
.pnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:8px}.page img{display:block;width:100%;height:100%}
.page{background:#fff;color:#111;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.15);aspect-ratio:210/297;overflow:hidden;padding:0;margin-bottom:10px;--accent2:#1e7fd0;--mut:#888;--accent:#1e7fd0}.page .pt{text-align:center;font-weight:700;font-size:15px}.page .pm{text-align:center;font-size:9px;color:#777;margin-bottom:4px}.page svg{display:block;width:100%;height:auto}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-family:inherit;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--accent)}
select,input[type=number]{font:inherit;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=range]{accent-color:var(--accent);width:140px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--ink)}
.tg{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.tg.on{background:#34c759}.tg.on::after{left:23px}
.li{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--line);margin-bottom:8px;cursor:pointer}
.li.cur{outline:2px solid var(--accent)}
.li b{flex:1}
#fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:15;display:none;gap:10px}#fab.on{display:flex}#fab button{width:62px;height:62px;border-radius:50%;border:0;font-size:22px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}#fab2{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:14;display:flex;gap:10px}#fab2 button{width:54px;height:54px;border-radius:50%;border:0;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer}#fab2 #fpS{background:#8e8e93}.rec #fab2{display:none}#pbInfo{display:none;align-self:center;flex-direction:column;gap:4px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:7px 12px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.15);font-size:12px;font-weight:700;min-width:110px}#pbInfo.on{display:flex}#pbInfo i{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}#pbInfo b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
#fabP{background:linear-gradient(135deg,var(--accent),var(--accent2))}#fabS{background:#ff3b30}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
footer{text-align:center;font-size:12px;color:var(--mut);padding:10px}
#printArea{display:none}
@page{size:A4 portrait;margin:12mm}
@media print{header,main,#editor,.sheet,#fab,#fab2,#toast{display:none!important}body{background:#fff;padding:0}#printArea{display:block;color:#000}#printArea h1{font-size:22px;text-align:center;margin:0 0 2px}#printArea .pm{text-align:center;font-size:11px;color:#555;margin-bottom:6px}#printArea svg{display:block;break-inside:avoid;page-break-inside:avoid}#printArea .pf{text-align:center;font-size:9px;color:#777;margin-top:8px}}
</style>
</head>
<body>
<header>
  <button class="ib" id="bLib" title="Spartiti">☰</button>
  <input id="title" maxlength="60" aria-label="Nome spartito">
  <button class="ib" id="bSet" title="Impostazioni">⚙︎</button>
</header>
<main>
  <div class="card top">
    <div class="live">
      <div id="bigNote">—</div>
      <div class="lv">
        <div id="status">Premi Registra e suona</div>
        <div id="hz">Corda/tasto: —</div>
        <div class="meter"><div id="cent"></div></div>
        <div class="meter"><div id="lvl"></div></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="ctrl" id="ctrl"></div>
    <div class="bar2">
      <div class="stp">Battute <button id="mMinus">−</button><span id="mcount">0</span><button id="mPlus">+</button></div>
      <button class="btn sm" id="bImp">Importa audio</button><input type="file" id="fileAud" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus,.flac,.webm,.amr,.3gp" hidden>
      <button class="btn sm" id="bPhone"></button>
      <button class="btn sm" id="bMet"></button>
      <button class="btn sm" id="bPlay">▶ Ascolta</button>
      <button class="btn sm" id="bPrint">Esporta</button>
      <button class="btn sm" id="bClrAll" style="color:#ff3b30">Svuota tutto</button>
    </div>
    <div class="bar2" id="quick"></div>
    <div class="meta" id="meta"></div>
  </div>
  <h2 id="printTitle" style="display:none"></h2>
  <div class="card"><div id="score"></div></div>
  <footer>Tocca una battuta o una nota per modificarla · Copyright © Ignazio Paolicelli</footer>
</main>

<div id="editor">
  <div class="er"><span id="einfo"></span>
    <button class="ch" data-a="clr">Svuota</button><button class="ch" data-a="recHere" style="background:#ff3b30;color:#fff">● Registra qui</button><button class="ch" data-a="insB">＋ Prima</button><button class="ch" data-a="insA">＋ Dopo</button>
    <button class="ch" data-a="br" id="bBr">↵ A capo dopo</button><button class="ch" data-a="delM" style="color:#ff3b30">Elimina battuta</button>
    <button class="ch" data-a="close">✕</button></div>
  <div class="er" id="eDur"></div>
  <div class="er" id="eNotes"></div>
  <div class="er" id="eCh"></div>
</div>

<div id="printArea"></div>
<div class="sheet" id="shExp"><div class="panel" id="pExp"></div></div>
<div class="sheet" id="shTS"><div class="panel" id="pTS"></div></div>
<div class="sheet" id="shKey"><div class="panel" id="pKey"></div></div>
<div class="sheet" id="shSet"><div class="panel" id="pSet"></div></div>
<div class="sheet" id="shLib"><div class="panel" id="pLib"></div></div>
<div id="fab2"><div id="pbInfo"><span id="pbTxt"></span><i><b id="pbBar"></b></i></div><button id="fpP" title="Ascolta/Pausa">▶</button><button id="fpS" title="Stop">■</button></div>
<div id="fab"><button id="fabP" title="Pausa">❚❚</button><button id="fabS" title="Fine">■</button></div>
<div id="toast"></div>

const EPS=1e-9,msum=ms=>ms.reduce((a,e)=>a+e.d,0);

function setKV(k,v){if(rec.on&&k!=='snd'&&k!=='pspd'&&k!=='pz'){toast('Termina prima la registrazione');return false}
  if(k==='beats'){sc.beats=+v;fixAll();save()}else S[k]=(k==='grid'||k==='pspd'||k==='pz')?+v:v;return true}
function drawQuick(){$('#quick').innerHTML=`<div style="width:100%;text-align:center;font-size:12px;color:var(--mut)">Cosa riconoscere</div>${MODESEG()}<div style="width:100%;text-align:center;font-size:12px;color:var(--mut);margin-top:4px">Suddivisione (nota più breve)</div>${GRIDSEG()}<div style="width:100%;text-align:center;font-size:12px;color:var(--mut);margin-top:4px">Metronomo della registrazione</div><div class="spd">${ico('slow')}<input type="range" id="rbpm" min="10" max="300" step="1" value="${sc.bpm}">${ico('fast')}<b id="rbpmV">${sc.bpm} bpm</b></div><div style="width:100%;text-align:center;font-size:12px;color:var(--mut);margin-top:4px">Ascolto: suono e velocità</div>${seg2('snd',[['gtr','Chitarra'],['pia','Pianoforte'],['syn','Semplice']],S.snd)}<div class="spd">${ico('slow')}<input type="range" id="pspd" min="10" max="300" step="1" value="${sc.pbpm||sc.bpm}">${ico('fast')}<b id="pspdV">${sc.pbpm||sc.bpm} bpm</b></div>`}
$('#quick').oninput=ev=>{if(ev.target.id==='rbpm'){if(rec.on&&!rec.paused){ev.target.value=sc.bpm;return toast('Metti in pausa o termina la registrazione per cambiare il tempo')}const pb=!sc.pbpm||sc.pbpm===sc.bpm;sc.bpm=+ev.target.value;if(pb){sc.pbpm=sc.bpm;const q=$('#pspd');if(q){q.value=sc.bpm;$('#pspdV').textContent=sc.bpm+' bpm'}}$('#rbpmV').textContent=sc.bpm+' bpm';save();$('#meta').textContent=$('#meta').textContent.replace(/♩ = \d+/,'♩ = '+sc.bpm);return}
  if(ev.target.id!=='pspd')return;sc.pbpm=+ev.target.value;$('#pspdV').textContent=ev.target.value+' bpm';save();
  clearTimeout(window._sp);window._sp=setTimeout(()=>{if(PB.on&&!PB.paused){pausePlay();playFrom(PB.pos)}},250)};
$('#quick').onclick=ev=>{const b=ev.target.closest('button');if(!b||!b.dataset.k)return;const k=b.dataset.k;if(setKV(k,b.dataset.v)){if(k==='snd'||k==='pspd'){save();drawQuick();if(k==='snd'){ensureAC();pluck(48,ac.currentTime+.02,1,.3);pluck(52,ac.currentTime+.04,1,.3);pluck(55,ac.currentTime+.06,1,.3)}}else apply()}};
function drawSet(){
  const fo=(a,b,v)=>{let s='';for(let i=a;i<=b;i++)s+=`<option ${i===v?'selected':''}>${i}</option>`;return s};
  $('#pSet').innerHTML=`<h2>Impostazioni <button class="ib" data-close>✕</button></h2>
  <div class="row"><div>Nomi delle note</div>${seg2('lang',[['it','DO RE MI'],['en','C D E']],S.lang)}</div>
  <div class="row"><div>Cosa riconoscere</div>${MODESEG()}</div>
  <div class="row"><div>Porzione di manico<small>Note riconosciute: ${nm(AMIN,1)} → ${nm(AMAX,1)} (${ALLOWED.size} note)</small></div>
   <div>dal <select id="fMin">${fo(0,14,S.fMin)}</select> al <select id="fMax">${fo(S.fMin,15,S.fMax)}</select></div></div>
  <div class="row"><div>Velocità (BPM)<small>♩ = ${sc.bpm}</small></div><input type="range" id="bpm" min="10" max="300" value="${sc.bpm}"></div>
  <div class="row"><div>Armatura di chiave</div>${keySel()}</div>
  <div class="row"><div>Nota più breve<small>Precisione delle durate</small></div>${GRIDSEG()}</div>
  <div class="row" style="border:0;padding-bottom:0"><b style="font-size:17px">Microfono</b></div>
  <div class="row"><div>Sensibilità<small>Aumenta se non sente le note, diminuisci se c'è rumore · ${S.sens}</small></div><input type="range" id="sens" min="1" max="10" value="${S.sens}"></div>
  <div class="row"><div>Guadagno<small>Volume d'ingresso del microfono · ${Math.round(S.mgain*100)}%</small></div><input type="range" id="mgain" min="25" max="400" step="5" value="${Math.round(S.mgain*100)}"></div>
  <div class="row"><div>Taglio dei bassi<small>Elimina rimbombi e ronzii sotto · ${S.mlo} Hz</small></div><input type="range" id="mlo" min="20" max="300" step="5" value="${S.mlo}"></div>
  <div class="row"><div>Taglio degli acuti<small>Elimina fruscii sopra · ${S.mhi} Hz</small></div><input type="range" id="mhi" min="1500" max="12000" step="100" value="${S.mhi}"></div>
  <div class="row"><div>Filtro rumori<small>Più alto = ignora più rumori e note sfiorate · ${S.nf}</small></div><input type="range" id="nf" min="1" max="20" value="${S.nf}"></div>
  <div class="row"><div>Sensibilità accordi<small>Più basso = meno accordi, più note singole e bicordi · ${S.chs}</small></div><input type="range" id="chs" min="1" max="10" value="${S.chs}"></div>
  <div class="row"><button class="btn sm" data-reseq="1">Ripristina valori del microfono</button></div>
  <div class="row"><div>Terzine<small>Riconosce e scrive le terzine</small></div>${tg('trip',S.trip)}</div>
  <div class="row"><div>Tempo automatico<small>Per l'audio importato: stima da solo i bpm e l'inizio della battuta</small></div>${tg('autoT',S.autoT)}</div>
  <div class="row"><div>LA di riferimento (Hz)</div><input type="number" id="a4" min="415" max="466" value="${S.a4}" style="width:80px"></div>
  <div class="row"><div>Metronomo sonoro</div>${tg('click',S.click)}</div>
  <div class="row"><div>Volume metronomo<small>${S.vol}%</small></div><input type="range" id="vol" min="0" max="100" value="${S.vol}"></div>
  <div class="row"><div>Battuta a vuoto prima di registrare</div>${tg('countIn',S.countIn)}</div>
  <div class="row"><div>Mostra corda e tasto</div>${tg('tab',S.tab)}</div>
  <div class="row"><div>Dimensione PDF (A4)<small>Più piccola = più battute per pagina</small></div>${seg2('pz',[[0.7,'S'],[0.85,'M'],[1,'L'],[1.2,'XL'],[1.4,'XXL']],S.pz)}</div>
  <div class="row" style="border:0"><div>Tema</div><div class="sw">${Object.keys(THEMES).map(t=>`<button data-th="${t}" class="${S.theme===t?'on':''}" title="${t}" style="background:linear-gradient(135deg,${THEMES[t][0]},${THEMES[t][1]})"></button>`).join('')}</div></div>`;
}
$('#pSet').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.reseq){Object.assign(S,{sens:5,mgain:1,mlo:60,mhi:6000,nf:4,chs:5});applyEQ();save();drawSet();toast('Valori del microfono ripristinati');return}
  if(b.dataset.close!==undefined)return $('#shSet').classList.remove('open');
  if(b.dataset.k&&!setKV(b.dataset.k,b.dataset.v))return;
  if(b.dataset.t)S[b.dataset.t]=!S[b.dataset.t];
  if(b.dataset.th){S.theme=b.dataset.th;document.documentElement.dataset.theme=S.theme}
  apply()};
$('#pSet').onchange=$('#pSet').oninput=ev=>{const t=ev.target;if(!t.id)return;
  if(t.id==='fMin'){S.fMin=+t.value;if(S.fMax<S.fMin)S.fMax=S.fMin}
  if(t.id==='xkey'){sc.key=+t.value;save();render();return}
  if(t.id==='fMax')S.fMax=+t.value;
  if(t.id==='bpm'){if(rec.on)return;sc.bpm=+t.value;t.previousElementSibling.querySelector('small').textContent='♩ = '+sc.bpm;save();render();return}
  if(t.id==='vol'){S.vol=+t.value;t.previousElementSibling.querySelector('small').textContent=S.vol+'%';save();drawMet();return}
  if(['sens','mgain','mlo','mhi','nf','chs'].includes(t.id)){S[t.id]=t.id==='mgain'?+t.value/100:+t.value;applyEQ();save();const sm=t.previousElementSibling.querySelector('small');if(sm)sm.textContent=sm.textContent.replace(/·.*$/,'· '+(t.id==='mgain'?t.value+'%':t.id==='mlo'||t.id==='mhi'?t.value+' Hz':t.value));return}
  if(t.id==='a4'){const v=+t.value;if(v>=415&&v<=466)S.a4=v;save();return}
  apply()};
function apply(){calcAllowed();drawQuick();drawMet();save();drawSet();drawCtrl();if(sel)drawEd();render()}
$('#bSet').onclick=()=>{drawSet();$('#shSet').classList.add('open')};
/* ---------- LIBRARY ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function drawLib(){
  $('#pLib').innerHTML=`<h2>I miei spartiti <button class="ib" data-close>✕</button></h2>
  <button class="btn pri" data-new style="width:100%;margin-bottom:12px">＋ Nuovo spartito</button>`+
  lib.map(s=>`<div class="li ${s.id===sc.id?'cur':''}" data-open="${s.id}"><b>${esc(s.name)}</b><span style="color:var(--mut);font-size:13px">${s.measures.length} batt.</span><button class="ib" data-del="${s.id}" style="color:#ff3b30">🗑</button></div>`).join('');
}
$('#pLib').onclick=ev=>{if(rec.on)return toast('Termina prima la registrazione');const b=ev.target.closest('[data-close],[data-new],[data-del],[data-open]');if(!b)return;
  if(b.dataset.close!==undefined)return $('#shLib').classList.remove('open');
  if(b.dataset.new!==undefined){sc=newScore();lib.unshift(sc);open()}
  else if(b.dataset.del){if(!confirm('Eliminare questo spartito?'))return;lib=lib.filter(s=>s.id!==b.dataset.del);if(!lib.length)lib.push(newScore());if(!lib.includes(sc))sc=lib[0];save();drawLib();load()}
  else if(b.dataset.open){sc=lib.find(s=>s.id===b.dataset.open);open()}};
function open(){save();$('#shLib').classList.remove('open');load()}
function load(){fixAll();$('#title').value=sc.name;sel=null;drawQuick();$('#editor').classList.remove('open');drawCtrl();render()}
$('#bLib').onclick=()=>{drawLib();$('#shLib').classList.add('open')};
document.querySelectorAll('.sheet').forEach(s=>s.onclick=e=>{if(e.target===s)s.classList.remove('open')});
/* ---------- INIT ---------- */
document.documentElement.dataset.theme=S.theme;[['bImp','note'],['bPrint','doc'],['bClrAll','trash']].forEach(([i,n])=>$('#'+i).insertAdjacentHTML('afterbegin',ico(n)));
calcAllowed();drawMet();drawPhone();drawQuick();load();
setInterval(()=>{if(rec.on&&!rec.paused&&!rec.counting)render()},100);
function kick(){if(!rec.k){rec.k=1;requestAnimationFrame(()=>{rec.k=0;render()})}}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});
</script>
</body>
