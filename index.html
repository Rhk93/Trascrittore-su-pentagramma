<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spartito dal Vivo</title>
<style>
:root{--bg:linear-gradient(160deg,#fff0f7,#eef5ff 55%,#effff5);--card:rgba(255,255,255,.82);--ink:#1c1c1e;--mut:#8e8e93;--accent:#ff4f8b;--accent2:#6c5cff;--line:rgba(0,0,0,.08)}
[data-theme=mare]{--bg:linear-gradient(160deg,#e6f6ff,#f2fbff 60%,#e9fffb);--accent:#0a84ff;--accent2:#14b8a6}
[data-theme=tramonto]{--bg:linear-gradient(160deg,#fff3e3,#fff0f0 60%,#fff8e8);--accent:#ff7a00;--accent2:#ff2d55}
[data-theme=menta]{--bg:linear-gradient(160deg,#eafff4,#f4fff9 60%,#eef9ff);--accent:#00b383;--accent2:#5856d6}
[data-theme=limone]{--bg:linear-gradient(160deg,#fffbdc,#fffdf0 60%,#fff1f1);--accent:#f2a900;--accent2:#ff5e5e}
[data-theme=caramella]{--bg:linear-gradient(160deg,#f6ecff,#fff0fb 60%,#eaf7ff);--accent:#af52de;--accent2:#ff6fb5}
[data-theme=notte]{--bg:linear-gradient(160deg,#0c0c1d,#151530 60%,#0d1a24);--card:rgba(30,30,50,.82);--ink:#f2f2f7;--mut:#9a9ab0;--accent:#bf5af2;--accent2:#64d2ff;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);background-attachment:fixed;color:var(--ink);padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:color-mix(in srgb,var(--card) 70%,transparent);border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;font-family:inherit;font-weight:700;font-size:21px;border:0;background:transparent;color:var(--ink);padding:6px 4px;border-radius:10px;outline:none}
#title:focus{background:var(--card)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--accent);font-size:19px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.06);margin-bottom:12px;backdrop-filter:blur(12px)}
.live{display:flex;align-items:center;gap:14px}
#bigNote{font-size:44px;font-weight:800;min-width:110px;text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.lv{flex:1;min-width:0}
#hz{font-size:13px;color:var(--mut)}
.meter{height:8px;border-radius:5px;background:var(--line);position:relative;margin:7px 0;overflow:hidden}
#cent{position:absolute;top:0;bottom:0;width:6px;border-radius:3px;background:var(--accent);left:50%;transition:left .08s}
.meter::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--mut);opacity:.5}
#lvl{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .06s}
#status{font-size:14px;font-weight:600}
.dots{margin-top:2px;height:56px;opacity:.45;transition:opacity .3s}.dots.go{opacity:1}.dots svg{display:block}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:999px;padding:12px 20px;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.red{background:#ff3b30;color:#fff}
.btn.sm{padding:8px 14px;font-size:14px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:10px}
.stp{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 6px;box-shadow:0 2px 10px rgba(0,0,0,.07);font-size:14px;font-weight:600}
.stp button{width:30px;height:30px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:18px;cursor:pointer}
.meta{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
#score{color:var(--ink);overflow-x:auto}
#score svg{display:block;user-select:none}
.mh{cursor:pointer}
#editor{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.12);padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);transform:translateY(110%);transition:transform .25s}
#editor.open{transform:none}
.er{display:flex;gap:6px;overflow-x:auto;padding:4px 0;align-items:center}
.er::-webkit-scrollbar{display:none}
.ch{flex:none;border:0;border-radius:12px;padding:9px 11px;font-family:inherit;font-weight:600;font-size:14px;background:var(--line);color:var(--ink);cursor:pointer}
.ch.on{background:var(--accent);color:#fff}
.ch.nt{background:color-mix(in srgb,var(--accent2) 16%,transparent);color:var(--accent2);min-width:44px}
#einfo{font-size:13px;font-weight:600;flex:1;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.3);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}
[data-theme=notte] .panel{background:#1d1d33}
.panel h2{margin:0 0 12px;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.row small{color:var(--mut);display:block;font-size:12px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-family:inherit;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15);color:var(--accent)}
select,input[type=number]{font:inherit;padding:7px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=range]{accent-color:var(--accent);width:140px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--ink)}
.tg{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.tg.on{background:#34c759}.tg.on::after{left:23px}
.li{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--line);margin-bottom:8px;cursor:pointer}
.li.cur{outline:2px solid var(--accent)}
.li b{flex:1}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
footer{text-align:center;font-size:12px;color:var(--mut);padding:10px}
@media print{header,.card.top,#editor,.sheet,footer,.bar2,.ctrl{display:none!important}body{background:#fff}#printTitle{display:block!important}.card{box-shadow:none;background:#fff}}
</style>
</head>
<body>
<header>
  <button class="ib" id="bLib" title="Spartiti">☰</button>
  <input id="title" maxlength="60" aria-label="Nome spartito">
  <button class="ib" id="bSet" title="Impostazioni">⚙︎</button>
</header>
<main>
  <div class="card top">
    <div class="live">
      <div id="bigNote">—</div>
      <div class="lv">
        <div id="status">Premi Registra e suona</div>
        <div id="hz">Corda/tasto: —</div>
        <div class="meter"><div id="cent"></div></div>
        <div class="meter"><div id="lvl"></div></div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="ctrl" id="ctrl"></div>
    <div class="bar2">
      <div class="stp">Battute <button id="mMinus">−</button><span id="mcount">0</span><button id="mPlus">+</button></div>
      <button class="btn sm" id="bMet"></button>
      <button class="btn sm" id="bPlay">▶ Ascolta</button>
      <button class="btn sm" id="bPrint">⎙ Stampa/PDF</button>
    </div>
    <div class="bar2" id="quick"></div>
    <div class="meta" id="meta"></div>
  </div>
  <h2 id="printTitle" style="display:none"></h2>
  <div class="card"><div id="score"></div></div>
  <footer>Tocca una battuta o una nota per modificarla · Copyright © Ignazio Paolicelli</footer>
</main>

<div id="editor">
  <div class="er"><span id="einfo"></span>
    <button class="ch" data-a="clr">Svuota</button><button class="ch" data-a="recHere" style="background:#ff3b30;color:#fff">● Registra qui</button><button class="ch" data-a="insB">＋ Prima</button><button class="ch" data-a="insA">＋ Dopo</button>
    <button class="ch" data-a="br" id="bBr">↵ A capo dopo</button><button class="ch" data-a="delM" style="color:#ff3b30">Elimina battuta</button>
    <button class="ch" data-a="close">✕</button></div>
  <div class="er" id="eDur"></div>
  <div class="er" id="eNotes"></div>
  <div class="er" id="eCh"></div>
</div>

<div class="sheet" id="shSet"><div class="panel" id="pSet"></div></div>
<div class="sheet" id="shLib"><div class="panel" id="pLib"></div></div>
<div id="toast"></div>

<script>
"use strict";
const $=q=>document.querySelector(q);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const STR=[{n:6,m:40},{n:5,m:45},{n:4,m:50},{n:3,m:55},{n:2,m:59},{n:1,m:64}];
const IT=['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];
const EN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const LETI=['DO','RE','MI','FA','SOL','LA','SI'],LETE=['C','D','E','F','G','A','B'];
const LET=[0,0,1,1,2,3,3,4,4,5,5,6],SH=[0,1,0,1,0,0,1,0,1,0,1,0],SEM=[0,2,4,5,7,9,11];
const DUR=[16,12,8,6,4,3,2,1];
const DNAME={16:'Semibreve',8:'Minima',4:'Semiminima',2:'Croma',1:'Semicroma'};
const NOTES=e=>e.m==null?[]:Array.isArray(e.m)?e.m:[e.m];
const ICH=['DO','DO#','RE','MIb','MI','FA','FA#','SOL','LAb','LA','SIb','SI'],ECH=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const TYPES={maj:[[0,4,7],''],min:[[0,3,7],'m'],'7':[[0,4,7,10],'7'],maj7:[[0,4,7,11],'maj7'],m7:[[0,3,7,10],'m7'],sus4:[[0,5,7],'sus4'],sus2:[[0,2,7],'sus2'],dim:[[0,3,6],'dim']};
const OPEN={'0:maj':[-1,3,2,0,1,0],'2:maj':[-1,-1,0,2,3,2],'4:maj':[0,2,2,1,0,0],'5:maj':[1,3,3,2,1,1],'7:maj':[3,2,0,0,0,3],'9:maj':[-1,0,2,2,2,0],
'9:min':[-1,0,2,2,1,0],'2:min':[-1,-1,0,2,3,1],'4:min':[0,2,2,0,0,0],
'0:7':[-1,3,2,3,1,0],'2:7':[-1,-1,0,2,1,2],'4:7':[0,2,0,1,0,0],'7:7':[3,2,0,0,0,1],'9:7':[-1,0,2,0,2,0],'11:7':[-1,2,1,2,0,2],
'9:m7':[-1,0,2,0,1,0],'2:m7':[-1,-1,0,2,1,1],'4:m7':[0,2,0,0,0,0],
'0:maj7':[-1,3,2,0,0,0],'2:maj7':[-1,-1,0,2,2,2],'5:maj7':[-1,-1,3,2,1,0],'7:maj7':[3,2,0,0,0,2],'9:maj7':[-1,0,2,1,2,0],
'2:sus4':[-1,-1,0,2,3,3],'2:sus2':[-1,-1,0,2,3,0],'9:sus4':[-1,0,2,2,3,0],'9:sus2':[-1,0,2,2,0,0],'4:sus4':[0,2,2,2,0,0]};
const X=-99,ESH={maj:[0,2,2,1,0,0],min:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,X,1,1,0,X],sus4:[0,2,2,2,0,0],sus2:[0,2,4,4,0,0],dim:[0,1,2,0,X,X]},
 ASH={maj:[X,0,2,2,2,0],min:[X,0,2,2,1,0],'7':[X,0,2,0,2,0],m7:[X,0,2,0,1,0],maj7:[X,0,2,1,2,0],sus4:[X,0,2,2,3,0],sus2:[X,0,2,2,0,0],dim:[X,0,1,2,1,X]};
function voicing(r,ty){const o=OPEN[r+':'+ty];if(o)return o;const be=(r+8)%12,ba=(r+3)%12,uE=be<=ba;return(uE?ESH:ASH)[ty].map(v=>v<-50?-1:v+(uE?be:ba))}
const vNotes=fr=>fr.map((f,i)=>f<0?null:STR[i].m+f).filter(x=>x!==null);
const fStr=fr=>fr.map(f=>f<0?'x':f).join(fr.some(f=>f>9)?'-':'');
const chName=c=>(S.lang==='it'?ICH:ECH)[c[0]]+TYPES[c[1]][1];
const THEMES={arcobaleno:['#ff4f8b','#6c5cff'],mare:['#0a84ff','#14b8a6'],tramonto:['#ff7a00','#ff2d55'],menta:['#00b383','#5856d6'],limone:['#f2a900','#ff5e5e'],caramella:['#af52de','#ff6fb5'],notte:['#1d1d3a','#bf5af2']};

let S=Object.assign({lang:'it',fMin:0,fMax:5,grid:1,sens:5,a4:440,click:true,vol:60,mode:'all',countIn:true,tab:true,theme:'arcobaleno'},LS.get('sdv_set',{}));
if(!S.v2){S.grid=2;S.v2=1}
if(S.poly===false&&!S.v3)S.mode='single';S.v3=1;if(!S.v4){S.countIn=true;S.v4=1}
const POLY=()=>S.mode!=='single';
const newScore=()=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'Nuovo spartito',bpm:60,beats:4,measures:[[],[],[],[]]});
let lib=LS.get('sdv_lib',[]);if(!lib.length)lib.push(newScore());
let sc=lib.find(x=>x.id===LS.get('sdv_cur',null))||lib[0];
const save=()=>{LS.set('sdv_lib',lib);LS.set('sdv_cur',sc.id);LS.set('sdv_set',S)};
const mtof=m=>S.a4*Math.pow(2,(m-69)/12);
const nm=(m,oct)=>(S.lang==='it'?IT:EN)[m%12]+(oct?Math.floor(m/12)-1:'');
const diat=m=>LET[m%12]+7*(Math.floor(m/12)-1);
let ALLOWED=new Set(),AMIN=40,AMAX=69;
function calcAllowed(){ALLOWED=new Set();for(const s of STR)for(let f=S.fMin;f<=S.fMax;f++)ALLOWED.add(s.m+f);AMIN=Math.min(...ALLOWED);AMAX=Math.max(...ALLOWED)}
function pos(m){let b=null;for(const s of STR){const f=m-s.m;if(f>=S.fMin&&f<=S.fMax&&(!b||f<b.f))b={s:s.n,f}}return b}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- AUDIO ---------- */
let fbuf=null,lin=null,frameN=0;
let ac=null,an=null,buf=null,dB=new Float32Array(2400),loop=null,G=0.005;
function ensureAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}
async function initMic(){
  ensureAC();if(an)return true;
  try{const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=ac.createMediaStreamSource(st);an=ac.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=0;fbuf=new Float32Array(an.frequencyBinCount);lin=new Float32Array(an.frequencyBinCount);src.connect(an);buf=new Float32Array(an.fftSize);
    loop=setInterval(analyze,25);return true}
  catch(e){toast('Microfono non disponibile: consenti l\'accesso al microfono');return false}
}
function yin(fmin,fmax){
  const sr=ac.sampleRate,tMax=Math.min(2300,Math.ceil(sr/fmin)+2),tMin=Math.max(2,Math.floor(sr/fmax));
  const W=Math.min(buf.length-tMax-2,Math.max(1024,tMax*2)),off=buf.length-W-tMax-1,d=dB;
  d[0]=1;let sum=0;
  for(let t=1;t<=tMax;t++){let s=0;for(let i=0;i<W;i++){const x=buf[off+i]-buf[off+i+t];s+=x*x}sum+=s;d[t]=sum>0?s*t/sum:1}
  let tau=-1;
  for(let t=tMin;t<tMax;t++){if(d[t]<0.13){while(t+1<tMax&&d[t+1]<d[t])t++;tau=t;break}}
  if(tau<0){let mn=1,mt=-1;for(let t=tMin;t<tMax;t++)if(d[t]<mn){mn=d[t];mt=t}if(mn<0.28)tau=mt;else return -1}
  const a=d[tau-1],b=d[tau],c=d[tau+1],den=a-2*b+c;return sr/(tau+(den?0.5*(a-c)/den:0));
}
function analyze(){
  an.getFloatTimeDomainData(buf);
  const now=performance.now();let r=0;for(let i=buf.length-1024;i<buf.length;i++)r+=buf[i]*buf[i];r=Math.sqrt(r/1024);
  G=0.04*Math.pow(0.62,S.sens-1);
  $('#lvl').style.width=Math.min(100,r/G*12)+'%';
  frameN++;
  if(POLY()){if(now-rec.lastClick<70){metro(now);return}
    if(rec.on&&!rec.paused&&!rec.counting)segPoly(r);
    else if(r>=G){if(frameN%4===0){grabSpec();showLive(analyzePoly(lin.slice()))}}
    else if(!rec.on||rec.paused){$('#bigNote').textContent='—';$('#bigNote').style.fontSize=''}
    metro(now);return}
  let obs='U';
  if(now-rec.lastClick<70){}
  else if(r<((rec.on&&rec.cur&&rec.cur.m!==null)?G*0.3:G)){obs='R';if(!rec.on||rec.paused){$('#bigNote').textContent='—'}}
  else{const f=yin(mtof(AMIN)*0.85,mtof(AMAX)*1.25);
    if(f>0){const mf=69+12*Math.log2(f/S.a4),n=Math.round(mf);
      if(ALLOWED.has(n)&&Math.abs(mf-n)<0.42){obs=n;const p=pos(n);$('#bigNote').textContent=nm(n,1);$('#bigNote').style.fontSize='';
        $('#hz').textContent=f.toFixed(1)+' Hz · '+(p?p.s+'ª corda, tasto '+p.f:'');$('#cent').style.left=(50+(mf-n)*90)+'%'}
      else $('#hz').textContent=f.toFixed(1)+' Hz · fuori dalla porzione scelta'}}
  if(rec.on&&!rec.paused&&!rec.counting)seg(obs,r);
  metro(now);
}
/* ---------- POLIFONIA ---------- */
function grabSpec(){an.getFloatFrequencyData(fbuf);for(let k=0;k<lin.length;k++)lin[k]=Math.pow(10,fbuf[k]/20)}
function multiPitch(M){
  const df=ac.sampleRate/an.fftSize,cands=[...ALLOWED].sort((a,b)=>a-b),out=[];
  const k0=Math.floor(70/df),k1=Math.floor(2500/df),tmp=Array.from(M.subarray(k0,k1)).sort((a,b)=>a-b),fl=tmp[tmp.length>>1]*2+1e-9;
  const win=f=>[Math.max(1,Math.floor(f*0.982/df)),Math.min(M.length-2,Math.ceil(f*1.018/df))];
  const harm=m=>{const f=mtof(m),A=[];for(let h=1;h<=10&&f*h<5000;h++){const[lo,hi]=win(f*h);let mx=0;for(let k=lo;k<=hi;k++)if(M[k]>mx&&M[k]>=M[k-1]&&M[k]>=M[k+1])mx=M[k];A.push(Math.max(0,mx-fl))}return A};
  const used=new Set();let first=0;
  for(let it=0;it<6;it++){
    let best=-1,bs=0,bA=null;
    for(const m of cands){if(used.has(m))continue;const A=harm(m),f=mtof(m);let s=0,mx=0;
      A.forEach((a,h)=>{s+=a*(f+27)/((h+1)*f+320);if(a>mx)mx=a});

    const tot=row.ms.reduce((a,l)=>a+l.w,0);let k=(W-4-row.pre)/tot;if(ri===rows.length-1&&row.ms.length<4&&!BR.has(row.ms[row.ms.length-1].mi))k=Math.min(k,1.25);k=Math.max(k,0.85);
    const RH=Math.max(H,152+(Math.max(...row.ms.flatMap(l=>l.it.map(p=>p.lines)))-1)*11+(S.tab?22:12));rhs.push(RH);
    let s='',x=row.pre;
    row.ms.forEach(ly=>{
      const mw=ly.w*k,mi=ly.mi,isM=(sel&&sel.mi===mi)||(rec.on&&rec.at===mi);
      s+=`<rect class="mh" data-mi="${mi}" x="${x+1}" y="6" width="${mw-2}" height="${RH-8}" rx="12" fill="${isM?'var(--accent)':(ly.over?'#ff3b30':'transparent')}" fill-opacity="${isM||ly.over?.12:0}"/>`;
      s+=`<text x="${x+4}" y="18" font-size="10" fill="var(--mut)" pointer-events="none">${mi+1}${BR.has(mi)?' ↵':''}</text>`;
      let cx=x+8*k;
      ly.it.forEach(p=>{const pk=p.w*k,nx=cx+pk/2+(p.na?4+(p.na>1?4:0):0);cx+=pk;
        const isS=isM&&sel.ei===p.ei&&p.ei!==undefined,col=isS?'var(--accent)':'currentColor';
        let g='';
        if(p.rest){g=drawRestFull(p.v,p.empty?x+mw/2:nx,col,p.empty?.35:0);notes.push({rest:true})}
        else{g=drawNote(p,nx,col);notes.push({x:nx,ys:p.st.map(yS),ri,tie:p.tie,up:p.up})}
        s+=p.ei!==undefined?`<g data-mi="${mi}" data-ei="${p.ei}" class="mh"><rect x="${nx-12}" y="20" width="24" height="${RH-24}" fill="transparent"/>${g}</g>`:`<g pointer-events="none">${g}</g>`;
      });
      x+=mw;
      const last=mi===meas.length-1;
      s+=last?ln(x-6,TOP,x-6,BOT,1.2)+`<rect x="${x-4}" y="${TOP}" width="4" height="40" fill="currentColor"/>`:ln(x,TOP,x,BOT,1.2);
    });
    let st='';for(let i=0;i<5;i++)st+=ln(4,TOP+i*10,x,TOP+i*10,1);
    const C=clefFit();st+=`<text x="${C.x}" y="${C.y}" font-size="${C.fs}" font-family="${CF}" fill="currentColor">𝄞</text>`;
    if(ri===0)st+=`<text x="${PRE+10}" y="${TOP+17}" text-anchor="middle" font-size="21" font-weight="800" font-family="Georgia,serif" fill="currentColor">${sc.beats}</text><text x="${PRE+10}" y="${TOP+37}" text-anchor="middle" font-size="21" font-weight="800" font-family="Georgia,serif" fill="currentColor">4</text>`;
    strs.push(st+s);ends.push(x);
  });
  notes.forEach((n,i)=>{if(n.rest||!n.tie)return;const nx=notes[i+1],dy=n.up?8:-8,cy=n.up?7:-7;
    const x2=(nx&&!nx.rest&&nx.ri===n.ri)?nx.x-5:Math.min(n.x+26,ends[n.ri]);
    n.ys.forEach(y=>strs[n.ri]+=`<path d="M${n.x+5} ${y+dy} Q${(n.x+5+x2)/2} ${y+dy+cy} ${x2} ${y+dy}" fill="none" stroke="currentColor" stroke-width="1.4"/>`)});
  host.innerHTML=strs.map((s,i)=>`<svg width="${Math.max(W,ends[i]+4)}" height="${rhs[i]}">${s}</svg>`).join('');
  if(rec.on)host.lastElementChild.scrollIntoView({block:'nearest'});
}
/* ---------- EDITOR ---------- */
let ed={v:4,dot:false,sharp:false,oct:3,stk:false,cr:0,ct:'maj'};
const edD=()=>ed.dot&&ed.v>1?ed.v*1.5:ed.v;
function select(mi,ei){
  sel={mi,ei};const e=ei!=null?sc.measures[mi][ei]:null;
  if(e){const d=e.d;if([12,6,3].includes(d)){ed.v=d/1.5;ed.dot=true}else if(DUR.includes(d)){ed.v=d;ed.dot=false}
    const ns=NOTES(e);if(ns.length){const lo=Math.min(...ns);ed.oct=Math.floor(lo/12)-1;ed.sharp=!!SH[lo%12];ensureAC();ns.forEach((m,i)=>pluck(m,ac.currentTime+.01+i*.018,.5,.25))}}
  drawEd();$('#editor').classList.add('open');drawCtrl();render();
}
function shiftBr(from,d){sc.br=(sc.br||[]).map(i=>i>=from?i+d:i)}
function closeEd(){sel=null;$('#editor').classList.remove('open');drawCtrl();render()}
function drawEd(){
  if(!sel)return;const ms=sc.measures[sel.mi],sum=ms.reduce((a,e)=>a+e.d,0),L=sc.beats*4;
  const fb=v=>(v/4).toLocaleString('it-IT',{maximumFractionDigits:2});
  $('#einfo').innerHTML='Battuta '+(sel.mi+1)+' · <span style="color:'+(sum>L?'#ff3b30':sum===L?'#34c759':'var(--mut)')+'">'+fb(sum)+' di '+sc.beats+' tempi</span>';
  $('#bBr').classList.toggle('on',(sc.br||[]).includes(sel.mi));
  $('#eDur').innerHTML=[16,8,4,2,1].map(v=>`<button class="ch ${ed.v===v?'on':''}" data-d="${v}">${DNAME[v]}</button>`).join('')+`<button class="ch ${ed.dot?'on':''}" data-a="dot">• Punto</button>`;
  const L7=S.lang==='it'?LETI:LETE;
  $('#eNotes').innerHTML=`<button class="ch ${ed.stk?'on':''}" data-a="stk">＋ Sovrapponi</button>`+L7.map((n,i)=>`<button class="ch nt" data-n="${i}">${n}${ed.sharp?'#':''}</button>`).join('')+
    `<button class="ch ${ed.sharp?'on':''}" data-a="sh">#</button><button class="ch" data-a="o-">Ott −</button><span class="ch" style="background:transparent">${ed.oct}</span><button class="ch" data-a="o+">Ott +</button><button class="ch" data-a="rest">Pausa</button><button class="ch" data-a="del">⌫</button>`;
  $('#eCh').innerHTML=`<select id="cRoot">${(S.lang==='it'?ICH:ECH).map((n,i)=>`<option value="${i}" ${ed.cr===i?'selected':''}>${n}</option>`).join('')}</select><select id="cType">${Object.keys(TYPES).map(t=>`<option value="${t}" ${ed.ct===t?'selected':''}>${t==='maj'?'maggiore':t==='min'?'minore':TYPES[t][1]}</option>`).join('')}</select><button class="ch nt" data-a="chord">Inserisci accordo</button>`;
}
$('#editor').onchange=ev=>{if(ev.target.id==='cRoot')ed.cr=+ev.target.value;if(ev.target.id==='cType')ed.ct=ev.target.value};
$('#editor').onclick=ev=>{
  const b=ev.target.closest('button');if(!b||!sel)return;
  const ms=sc.measures[sel.mi],e=sel.ei!=null?ms[sel.ei]:null,a=b.dataset.a;
  if(b.dataset.d){ed.v=+b.dataset.d;if(ed.v===1)ed.dot=false;if(e)e.d=edD()}
  else if(b.dataset.n){const m=(ed.oct+1)*12+SEM[+b.dataset.n]+(ed.sharp?1:0);if(e){if(ed.stk&&e.m!==null){const a=NOTES(e).slice(),j=a.indexOf(m);if(j>=0)a.splice(j,1);else a.push(m);a.sort((x,y)=>x-y);e.m=a.length?(a.length===1?a[0]:a):null}else e.m=m;delete e.c;delete e.f}else{ms.push({m,d:edD()});if(ed.stk)sel.ei=ms.length-1}ensureAC();pluck(m,ac.currentTime+.01,.4,.3)}
  else if(a==='dot'){ed.dot=!ed.dot&&ed.v>1;if(e)e.d=edD()}
  else if(a==='sh')ed.sharp=!ed.sharp;
  else if(a==='o-')ed.oct=Math.max(1,ed.oct-1);
  else if(a==='o+')ed.oct=Math.min(6,ed.oct+1);
  else if(a==='stk')ed.stk=!ed.stk;
  else if(a==='chord'){const fr=voicing(ed.cr,ed.ct),o={m:vNotes(fr),c:[ed.cr,ed.ct],f:fStr(fr)};if(e){Object.assign(e,o)}else ms.push(Object.assign({d:edD()},o));ensureAC();o.m.forEach((m,i)=>pluck(m,ac.currentTime+.01+i*.03,.8,.2))}
  else if(a==='rest'){if(e){e.m=null;delete e.t;delete e.c;delete e.f}else ms.push({m:null,d:edD()})}
  else if(a==='del'){if(e){ms.splice(sel.ei,1);sel.ei=null}else ms.pop()}
  else if(a==='br'){const b=sc.br=sc.br||[],j=b.indexOf(sel.mi);if(j<0)b.push(sel.mi);else b.splice(j,1)}
  else if(a==='insB'){shiftBr(sel.mi,1);sc.measures.splice(sel.mi,0,[]);sel.ei=null}
  else if(a==='insA'){shiftBr(sel.mi+1,1);sc.measures.splice(sel.mi+1,0,[]);sel={mi:sel.mi+1,ei:null}}
  else if(a==='clr'){ms.length=0;sel.ei=null;toast('Battuta '+(sel.mi+1)+' svuotata: premi Registra qui')}
  else if(a==='delM'){sc.br=(sc.br||[]).filter(i=>i!==sel.mi);shiftBr(sel.mi+1,-1);sc.measures.splice(sel.mi,1);save();if(!sc.measures.length)return closeEd();sel={mi:Math.min(sel.mi,sc.measures.length-1),ei:null}}
  else if(a==='close')return closeEd();
  else if(a==='recHere')return startRec();
  save();drawEd();render();
};
$('#score').onclick=ev=>{if(rec.on)return;const g=ev.target.closest('[data-ei]'),r=ev.target.closest('[data-mi]');
  if(g)select(+g.dataset.mi,+g.dataset.ei);else if(r)select(+r.dataset.mi,null)};
$('#mPlus').onclick=()=>{if(rec.on)return;sc.measures.push([]);save();render()};
$('#mMinus').onclick=()=>{if(rec.on||!sc.measures.length)return;sc.measures.pop();if(sel&&sel.mi>=sc.measures.length)closeEd();save();render()};
$('#bPlay').onclick=play;
function drawMet(){$('#bMet').textContent=S.click&&S.vol>0?'🔔 Metronomo':'🔕 Metronomo'}
$('#bMet').onclick=()=>{S.click=!S.click;if(S.click&&!S.vol)S.vol=60;save();drawMet()};
$('#bPrint').onclick=()=>{$('#printTitle').textContent=sc.name;window.print()};
$('#title').oninput=e=>{sc.name=e.target.value||'Senza titolo';save()};
/* ---------- SETTINGS ---------- */
function seg2(key,opts,val){return`<div class="seg">${opts.map(o=>`<button data-k="${key}" data-v="${o[0]}" class="${String(val)===String(o[0])?'on':''}">${o[1]}</button>`).join('')}</div>`}
const tg=(k,v)=>`<button class="tg ${v?'on':''}" data-t="${k}"></button>`;
const MODESEG=()=>seg2('mode',[['single','Note singole'],['bi','Bicordi'],['chord','Accordi'],['all','Tutto']],S.mode);
const GRIDSEG=()=>seg2('grid',[[4,'♩ Semiminima'],[2,'♪ Croma'],[1,'Semicroma']],S.grid);
function setKV(k,v){if(rec.on){toast('Termina prima la registrazione');return false}
  if(k==='beats')sc.beats=+v;else S[k]=k==='grid'?+v:v;return true}
function drawQuick(){$('#quick').innerHTML=`<div style="width:100%;text-align:center;font-size:12px;color:var(--mut)">Cosa riconoscere</div>${MODESEG()}<div style="width:100%;text-align:center;font-size:12px;color:var(--mut);margin-top:4px">Suddivisione (nota più breve) · Tempo</div>${GRIDSEG()}${seg2('beats',[[2,'2/4'],[3,'3/4'],[4,'4/4']],sc.beats)}`}
$('#quick').onclick=ev=>{const b=ev.target.closest('button');if(!b||!b.dataset.k)return;if(setKV(b.dataset.k,b.dataset.v))apply()};
function drawSet(){
  const fo=(a,b,v)=>{let s='';for(let i=a;i<=b;i++)s+=`<option ${i===v?'selected':''}>${i}</option>`;return s};
  $('#pSet').innerHTML=`<h2>Impostazioni <button class="ib" data-close>✕</button></h2>
  <div class="row"><div>Nomi delle note</div>${seg2('lang',[['it','DO RE MI'],['en','C D E']],S.lang)}</div>
  <div class="row"><div>Cosa riconoscere</div>${MODESEG()}</div>
  <div class="row"><div>Porzione di manico<small>Note riconosciute: ${nm(AMIN,1)} → ${nm(AMAX,1)} (${ALLOWED.size} note)</small></div>
   <div>dal <select id="fMin">${fo(0,14,S.fMin)}</select> al <select id="fMax">${fo(S.fMin,15,S.fMax)}</select></div></div>
  <div class="row"><div>Velocità (BPM)<small>♩ = ${sc.bpm}</small></div><input type="range" id="bpm" min="40" max="200" value="${sc.bpm}"></div>
  <div class="row"><div>Tempo</div>${seg2('beats',[[2,'2/4'],[3,'3/4'],[4,'4/4']],sc.beats)}</div>
  <div class="row"><div>Nota più breve<small>Precisione delle durate</small></div>${GRIDSEG()}</div>
  <div class="row"><div>Sensibilità microfono<small>Aumenta se non sente le note, diminuisci se c'è rumore</small></div><input type="range" id="sens" min="1" max="10" value="${S.sens}"></div>
  <div class="row"><div>LA di riferimento (Hz)</div><input type="number" id="a4" min="415" max="466" value="${S.a4}" style="width:80px"></div>
  <div class="row"><div>Metronomo sonoro</div>${tg('click',S.click)}</div>
  <div class="row"><div>Volume metronomo<small>${S.vol}%</small></div><input type="range" id="vol" min="0" max="100" value="${S.vol}"></div>
  <div class="row"><div>Battuta a vuoto prima di registrare</div>${tg('countIn',S.countIn)}</div>
  <div class="row"><div>Mostra corda e tasto</div>${tg('tab',S.tab)}</div>
  <div class="row" style="border:0"><div>Tema</div><div class="sw">${Object.keys(THEMES).map(t=>`<button data-th="${t}" class="${S.theme===t?'on':''}" title="${t}" style="background:linear-gradient(135deg,${THEMES[t][0]},${THEMES[t][1]})"></button>`).join('')}</div></div>`;
}
$('#pSet').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.close!==undefined)return $('#shSet').classList.remove('open');
  if(b.dataset.k&&!setKV(b.dataset.k,b.dataset.v))return;
  if(b.dataset.t)S[b.dataset.t]=!S[b.dataset.t];
  if(b.dataset.th){S.theme=b.dataset.th;document.documentElement.dataset.theme=S.theme}
  apply()};
$('#pSet').onchange=$('#pSet').oninput=ev=>{const t=ev.target;if(!t.id)return;
  if(t.id==='fMin'){S.fMin=+t.value;if(S.fMax<S.fMin)S.fMax=S.fMin}
  if(t.id==='fMax')S.fMax=+t.value;
  if(t.id==='bpm'){if(rec.on)return;sc.bpm=+t.value;t.previousElementSibling.querySelector('small').textContent='♩ = '+sc.bpm;save();render();return}
  if(t.id==='vol'){S.vol=+t.value;t.previousElementSibling.querySelector('small').textContent=S.vol+'%';save();drawMet();return}
  if(t.id==='sens'){S.sens=+t.value;save();return}
  if(t.id==='a4'){const v=+t.value;if(v>=415&&v<=466)S.a4=v;save();return}
  apply()};
function apply(){calcAllowed();drawQuick();drawMet();save();drawSet();drawCtrl();if(sel)drawEd();render()}
$('#bSet').onclick=()=>{drawSet();$('#shSet').classList.add('open')};
/* ---------- LIBRARY ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function drawLib(){
  $('#pLib').innerHTML=`<h2>I miei spartiti <button class="ib" data-close>✕</button></h2>
  <button class="btn pri" data-new style="width:100%;margin-bottom:12px">＋ Nuovo spartito</button>`+
  lib.map(s=>`<div class="li ${s.id===sc.id?'cur':''}" data-open="${s.id}"><b>${esc(s.name)}</b><span style="color:var(--mut);font-size:13px">${s.measures.length} batt.</span><button class="ib" data-del="${s.id}" style="color:#ff3b30">🗑</button></div>`).join('');
}
$('#pLib').onclick=ev=>{if(rec.on)return toast('Termina prima la registrazione');const b=ev.target.closest('[data-close],[data-new],[data-del],[data-open]');if(!b)return;
  if(b.dataset.close!==undefined)return $('#shLib').classList.remove('open');
  if(b.dataset.new!==undefined){sc=newScore();lib.unshift(sc);open()}
  else if(b.dataset.del){if(!confirm('Eliminare questo spartito?'))return;lib=lib.filter(s=>s.id!==b.dataset.del);if(!lib.length)lib.push(newScore());if(!lib.includes(sc))sc=lib[0];save();drawLib();load()}
  else if(b.dataset.open){sc=lib.find(s=>s.id===b.dataset.open);open()}};
function open(){save();$('#shLib').classList.remove('open');load()}
function load(){$('#title').value=sc.name;sel=null;drawQuick();$('#editor').classList.remove('open');drawCtrl();render()}
$('#bLib').onclick=()=>{drawLib();$('#shLib').classList.add('open')};
document.querySelectorAll('.sheet').forEach(s=>s.onclick=e=>{if(e.target===s)s.classList.remove('open')});
/* ---------- INIT ---------- */
document.documentElement.dataset.theme=S.theme;calcAllowed();drawMet();drawQuick();load();
setInterval(()=>{if(rec.on&&!rec.paused&&!rec.counting)render()},350);
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});
</script>
